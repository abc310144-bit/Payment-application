<script>
const TYPES = ['個人代墊報支','廠商實報實銷','廠商預付 / 訂金','通路費用 (通路後扣)','URMART 月結廠商']
const STATUSES = ['草稿','待審核','審核不通過','待付款','待核銷','部分核銷','已完成','已作廢']
const META = {
  '個人代墊報支': { title: '個人代墊報支（零用金）', desc: '我已先用個人款項墊付餐費、車資、雜支等，請公司退款至我的薪資帳戶。', petty: true },
  '廠商實報實銷': { title: '廠商實報實銷（一般付款）', desc: '已取得廠商開立的正式發票或收據，請公司直接匯款給該廠商。' },

async function downloadVoucherPdf(row){
  const host = document.createElement('div')
  host.style.cssText = 'position:fixed;left:-10000px;top:0;background:#fff;'
  host.innerHTML = buildVoucherPdfHtml(row)
  document.body.appendChild(host)
  try {
    await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js')
    await loadScript('https://cdn.jsdelivr.net/npm/jspdf@4.2.1/dist/jspdf.umd.min.js')
    await loadScript('https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js')
    const root = host.querySelector('.pdf-root')
    const images = Array.from(root.querySelectorAll('img'))
    await Promise.all(images.map((img) => img.complete ? Promise.resolve() : new Promise((resolve) => { img.onload = resolve; img.onerror = resolve })))
    const PDFDocument = window.PDFLib.PDFDocument
    const merged = await PDFDocument.create()
    const failed = []
    let working = null
    let cursor = { y: 8 }
    const margin = 8
    const createWorking = () => new window.jspdf.jsPDF({ orientation: 'portrait', unit: 'mm', format: 'a4' })
    const pageSizeOf = (pdf) => ({
      pageWidth: pdf.internal.pageSize.getWidth(),
      pageHeight: pdf.internal.pageSize.getHeight(),
    })
    const capture = (el) => window.html2canvas(el, { scale: 2, backgroundColor: '#ffffff', useCORS: true })
    const ensureWorking = () => {
      if (!working) {
        working = createWorking()
        cursor = { y: margin }
      }
      return working
    }
    const flushWorking = async () => {
      if (!working) return
      const src = await PDFDocument.load(working.output('arraybuffer'))
      const pages = await merged.copyPages(src, src.getPageIndices())
      pages.forEach((page) => merged.addPage(page))
      working = null
    }
    const appendKeep = (canvas, pdf) => {
      const { pageWidth, pageHeight } = pageSizeOf(pdf)
      const usableWidth = pageWidth - margin * 2
      const usableHeight = pageHeight - margin * 2
      let drawWidth = usableWidth
      let drawHeight = canvas.height * usableWidth / canvas.width
      if (drawHeight > usableHeight) {
        const scale = usableHeight / drawHeight
        drawHeight = usableHeight
        drawWidth = usableWidth * scale
      }
      const remaining = pageHeight - margin - cursor.y
      if (cursor.y > margin + 0.5 && drawHeight > remaining) {
        pdf.addPage()
        cursor.y = margin
      }
      pdf.addImage(canvas.toDataURL('image/png'), 'PNG', margin, cursor.y, drawWidth, drawHeight)
      cursor.y += drawHeight + 3
    }
    const form = root.querySelector('.pay-form')
    if (form) {
      const pdf = ensureWorking()
      const { pageWidth, pageHeight } = pageSizeOf(pdf)
      const usableWidth = pageWidth - margin * 2
      const usableHeight = pageHeight - margin * 2
      const formCanvas = await capture(form)
      const imgHeight = formCanvas.height * usableWidth / formCanvas.width
      let heightLeft = imgHeight
      let y = margin
      pdf.addImage(formCanvas.toDataURL('image/png'), 'PNG', margin, y, usableWidth, imgHeight)
      heightLeft -= usableHeight
      while (heightLeft > 0) {
        y = margin - (imgHeight - heightLeft)
        pdf.addPage()
        pdf.addImage(formCanvas.toDataURL('image/png'), 'PNG', margin, y, usableWidth, imgHeight)
        heightLeft -= usableHeight
      }
      if (imgHeight <= usableHeight) cursor.y = margin + imgHeight + 3
      else {
        const remainder = imgHeight % usableHeight
        cursor.y = (remainder === 0 ? pageHeight - margin : margin + remainder) + 3
      }
    }
    const nodes = Array.from(root.querySelectorAll('.pdf-keep, .pdf-embed-pdf'))
    for (const node of nodes) {
      if (node.classList.contains('pdf-embed-pdf')) {
        await flushWorking()
        const url = node.getAttribute('data-pdf-url')
        const name = node.getAttribute('data-pdf-name') || 'document.pdf'
        try {
          const res = await fetch(url)
          if (!res.ok) throw new Error('fetch')
          const src = await PDFDocument.load(await res.arrayBuffer(), { ignoreEncryption: true })
          const pages = await merged.copyPages(src, src.getPageIndices())
          if (!pages.length) throw new Error('empty')
          pages.forEach((page) => merged.addPage(page))
        } catch (e) {
          failed.push(name)
        }
        continue
      }
      const canvas = await capture(node)
      appendKeep(canvas, ensureWorking())
    }
    await flushWorking()
    const bytes = await merged.save()
    const blob = new Blob([bytes], { type: 'application/pdf' })
    const href = URL.createObjectURL(blob)
    const filename = row.no + '_導出文件.pdf'
    const link = document.createElement('a')
    link.href = href
    link.download = filename
    link.click()
    if (row.exportedFile && row.exportedFile.url && String(row.exportedFile.url).indexOf('blob:') === 0) {
      URL.revokeObjectURL(row.exportedFile.url)
    }
    row.exportedFile = { name: filename, type: 'application/pdf', url: href }
    if (failed.length) alert('以下 PDF 無法合併到導出檔，已略過：\n' + failed.join('\n'))
    return row.exportedFile
  } finally {
    host.remove()
  }
}

function fuzzyMatch(source, query){
  const normalize = (value) => value.toLowerCase().replace(/[\s\-_]/g, '')
  const haystack = normalize(source)
  const tokens = query.trim().split(/\s+/).map((token) => normalize(token)).filter(Boolean)

  const hasTo = Boolean(to)

  if (!day) return false

function parseMonth(value){
  if (!value) {
    const now = new Date()

function monthCells(y, m){
  const startPad = new Date(y, m - 1, 1).getDay()
  const days = new Date(y, m, 0).getDate()
  const prev = addMonths(y, m, -1)
  const prevDays = new Date(prev.y, prev.m, 0).getDate()
  const next = addMonths(y, m, 1)
  const cells = []
  for (let i = startPad - 1; i >= 0; i--) cells.push({ date: isoDate(prev.y, prev.m, prevDays - i), day: prevDays - i, inMonth: false })
  for (let day = 1; day <= days; day++) cells.push({ date: isoDate(y, m, day), day, inMonth: true })
  let nextDay = 1
  while (cells.length < 42) {
    cells.push({ date: isoDate(next.y, next.m, nextDay), day: nextDay, inMonth: false })
    nextDay++
  }
  return cells
}

      inRange ? ' is-in-range' : '',
      cell.date === todayStr && !isEdge ? ' is-today' : '',
      hover === cell.date ? ' is-hover' : '',
    ].join('')
    return `<button type="button" class="${cls}" data-date-pick="${cell.date}">${cell.day}</button>`
  }).join('')
  const leftNav = side === 'left'
    ? `<div class="date-cal-nav"><button type="button" data-date-nav="-12">«</button><button type="button" data-date-nav="-1">‹</button></div>`
    : `<span class="date-cal-nav-spacer"></span>`
  const rightNav = side === 'right'

    : `<span class="date-cal-nav-spacer"></span>`
  return `<div class="date-cal">
    <div class="date-cal-head">${leftNav}<span class="date-cal-title">${y}年 ${m}月</span>${rightNav}</div>

}

function completePay(row, options){
  const actual = (options && options.actualPaymentDate) || today()
  const exchangeRate = options && options.exchangeRate
  row.actual = actual
  row.status = needsWriteoff(row.type) ? '待核銷' : '已完成'
  if (exchangeRate != null) row.exchangeRate = exchangeRate
  const nextStatus = needsWriteoff(row.type) ? '待核銷' : '已完成'
  row.vouchers.forEach((item) => {
    if (item.status === '審核通過') {
      item.status = nextStatus
      if (!item.writebacks) item.writebacks = []
    }
  })
  state.payOpen = false
  state.payTargetId = ''
  state.payRate = ''
  state.payDate = ''
  state.payDateError = ''
  state.payError = ''
  state.notice = needsWriteoff(row.type)
    ? row.no + ' 已完成付款。此單為事後核銷，核銷歷史頁籤已出現（建檔人／財務均可看見）。'
    : row.no + '：已完成付款'
}

function nextThursday(iso){
  const d = new Date(iso + 'T00:00:00')
  const sun = new Date(d); sun.setDate(d.getDate() - d.getDay())
  const thu = new Date(sun); thu.setDate(sun.getDate() + 11)
  return thu.toISOString().slice(0,10)
}
function generalPay(iso){
  const d = new Date(iso + 'T00:00:00')
  const day = d.getDate(), y = d.getFullYear(), m = d.getMonth()
  if (day >= 21) return new Date(y, m+1, 15).toISOString().slice(0,10)
  if (day <= 5) return new Date(y, m, 15).toISOString().slice(0,10)
  const last = new Date(y, m+1, 0).getDate()
  return new Date(y, m, Math.min(30,last)).toISOString().slice(0,10)
}
function expectedFor(type, date){
  const meta = META[type]
  if (meta.petty) return nextThursday(date)
  if (meta.prepay) return date
  return generalPay(date)
}

function filePreviewHtml(file, label){
  if (!file) return ''
  const isImage = file.type && file.type.indexOf('image/') === 0
  const isPdf = file.type === 'application/pdf' || /\.pdf$/i.test(file.name || '')
  const body = isImage
    ? `<img src="${esc(file.url)}" alt="${esc(file.name)}">`
    : isPdf
      ? `<iframe class="file-preview-pdf" title="${esc(file.name)}" src="${esc(file.url)}"></iframe>`
      : `<a href="${esc(file.url)}" target="_blank">${esc(file.name)}</a>`
  return `<article class="file-preview"><div class="file-preview-tag">${label}</div>${body}</article>`
}
function renderViewModal(){
  const item = state.viewing
  if (!item) return ''
  const main = item.voucherFile
    ? filePreviewHtml(item.voucherFile, '主憑證')
    : '<p class="placeholder-note">尚未上傳主憑證</p>'
  const atts = (item.attachments || []).map((file, i) => filePreviewHtml(file, '附件 ' + (i + 1))).join('')
  return `<div class="modal-mask" id="detail-mask"><div class="modal-card">
    <div class="modal-head"><h2>檢視憑證</h2><button type="button" class="modal-close" id="modal-close">×</button></div>
    <div class="view-files-body">${main}${atts}</div>
    <div class="modal-foot"><button type="button" class="btn btn-default" id="modal-cancel">關閉</button></div>
  </div></div>`
}
function errText(errors, key){
  return errors && errors[key] ? `<p class="field-error">${esc(errors[key])}</p>` : ''
}
function errCls(errors, key){
  return errors && errors[key] ? ' error' : ''
}
function renderDraftModal(row){
  const d = state.draft
  const errors = d.errors || {}
  const second = PURPOSE_SECOND[d.purpose]
  const styles = voucherStyles(row.type)
  const taxLockedByCurrency = isForeignCurrency(rowCurrency(row))
  const allowDecimal = allowsDecimalAmount(rowCurrency(row))
  const effectiveTax = taxLockedByCurrency ? '未稅' : d.taxable
  const locked = effectiveTax === '未稅'
  const tot = voucherTotals(effectiveTax, d.lines, allowDecimal)
  const auto = autoFill(row)
  const secondField = second.kind === 'dateRange'
    ? `<div class="date-range"><input id="d-from" type="date" class="${!d.secondFrom && errors.second ? 'error' : ''}" value="${d.secondFrom}"${d.secondTo ? ` max="${d.secondTo}"` : ''}><span>至</span><input id="d-to" type="date" class="${!d.secondTo && errors.second ? 'error' : ''}" value="${d.secondTo}"${d.secondFrom ? ` min="${d.secondFrom}"` : ''}></div>`
    : `<input id="d-second" class="${errCls(errors,'second')}" type="${second.kind==='month'?'month':'text'}" placeholder="請輸入${second.label}" value="${esc(d.secondText)}">`
  const invoice = d.voucherStyle === '發票'
    ? `<div class="modal-row"><span class="required">發票格式</span><div class="modal-field"><select id="d-invfmt" class="${errCls(errors,'invoiceFormat')}"><option value="">請選擇</option>${INVOICE_FORMATS.map((x)=>`<option ${d.invoiceFormat===x?'selected':''}>${x}</option>`).join('')}</select>${errText(errors,'invoiceFormat')}</div></div>`
    : ''
  const lines = d.lines.map((line, i) => `
    <div class="line-row">
      <div class="line-cell">
        <input class="d-line-name${errCls(errors,'lineName-'+i)}" data-i="${i}" maxlength="50" placeholder="請輸入明細細項" value="${esc(line.name)}">
        ${errText(errors,'lineName-'+i)}
      </div>
      <select class="d-line-tax" data-i="${i}" ${locked ? 'disabled' : ''}><option ${!locked && line.taxable==='應稅'?'selected':''}>應稅</option><option ${locked || line.taxable==='未稅'?'selected':''}>未稅</option></select>
      <div class="line-cell">
        <input class="d-line-amt${errCls(errors,'lineAmount-'+i)}" data-i="${i}" inputmode="${allowDecimal ? 'decimal' : 'numeric'}" ${allowDecimal ? '' : 'pattern="[0-9]*"'} placeholder="${allowDecimal ? '可至小數第三位' : '請輸入金額'}" value="${esc(line.amount)}">
        ${errText(errors,'lineAmount-'+i)}
      </div>
      <div class="line-ops">
        ${d.lines.length > 1 ? `<button type="button" class="minus-btn" data-del="${i}">−</button>` : ''}
        ${i === d.lines.length - 1 ? `<button type="button" class="plus-btn" id="btn-add-line">+</button>` : ''}
      </div>
    </div>
  `).join('')
  return `<div class="modal-mask" id="detail-mask"><div class="modal-card" id="draft-card">
    <div class="modal-head"><h2>${state.modalMode==='edit'?'編輯明細':'新增明細'}</h2><button type="button" class="modal-close" id="modal-close">×</button></div>
    <label class="modal-row"><span class="required">款項用途</span><select id="d-purpose">${VOUCHER_PURPOSES.map((p)=>`<option ${d.purpose===p?'selected':''}>${p}</option>`).join('')}</select></label>
    <div class="modal-row"><span class="required">${second.label}</span><div class="modal-field">${secondField}${errText(errors,'second')}</div></div>
    <label class="modal-row"><span class="required">憑證樣式</span><select id="d-style">${styles.map((s)=>`<option ${d.voucherStyle===s?'selected':''}>${s}</option>`).join('')}</select></label>
    ${invoice}
    <div class="modal-row"><span class="required">發票號碼(憑證號碼)</span><div class="modal-field"><input id="d-invno" class="${errCls(errors,'invoiceNo')}" placeholder="請輸入憑證號碼" value="${esc(d.invoiceNo)}">${errText(errors,'invoiceNo')}</div></div>
    ${d.voucherStyle === '發票' ? `<div class="modal-row"><span class="required">發票日期</span><div class="modal-field"><input id="d-invdate" class="${errCls(errors,'invoiceDate')}" type="date" value="${esc(d.invoiceDate)}">${errText(errors,'invoiceDate')}</div></div>` : ''}
    <div class="modal-row"><span class="required">廠商統編</span><div class="modal-field"><input id="d-taxid" class="${errCls(errors,'vendorTaxId')}" maxlength="8" value="${esc(d.vendorTaxId)}">${errText(errors,'vendorTaxId')}</div></div>
    <div class="modal-row"><span class="required">是否應稅</span><div class="modal-field"><select id="d-tax" ${taxLockedByCurrency ? 'disabled' : ''}><option ${effectiveTax==='應稅'?'selected':''}>應稅</option><option ${effectiveTax==='未稅'?'selected':''}>未稅</option></select>${taxLockedByCurrency ? '<p class="field-hint">外幣付款僅能設定未稅。</p>' : ''}</div></div>
    <div class="sub-title">明細細項</div>
    <div class="line-head"><span class="required">明細細項</span><span class="required">是否應稅</span><span class="required">金額</span><span></span></div>
    ${lines}
    <label class="modal-row"><span>未稅金額</span><input readonly value="${formatAmount(tot.untaxedAmount, rowCurrency(row))}"></label>
    <label class="modal-row"><span>稅額</span><input readonly value="${formatAmount(tot.taxAmount, rowCurrency(row))}"></label>
    <label class="modal-row"><span>付款金額</span><input readonly value="${formatAmount(tot.payAmount, rowCurrency(row))}"></label>
    <div class="file-block"><label class="required">上傳憑證檔案</label><input id="d-file" type="file">${d.voucherFile ? `<div class="file-names">${d.voucherFile.name}</div>` : ''}${errText(errors,'voucherFile')}</div>
    <div class="file-block"><label>附件（ 選填，可上傳多個檔案 ）</label><input id="d-atts" type="file" multiple>${d.attachments.length ? `<div class="file-names">${d.attachments.map(f=>f.name).join('、')}</div>` : ''}</div>
    ${auto ? '<p class="placeholder-note">此單已設定結算月，新增明細會帶入對應款項用途與結算月。</p>' : ''}
    <div class="modal-foot">
      <button type="button" class="btn btn-default" id="modal-cancel">取消</button>
      <button type="button" class="btn btn-primary" id="modal-ok">確定</button>
    </div>
  </div></div>`
}
function syncDraftFromDom(){
  const d = state.draft
  if (!d) return
  const purpose = document.getElementById('d-purpose')
  if (purpose) d.purpose = purpose.value
  const second = document.getElementById('d-second')
  if (second) d.secondText = second.value
  const from = document.getElementById('d-from')
  if (from) d.secondFrom = from.value
  const to = document.getElementById('d-to')
  if (to) d.secondTo = to.value
  const style = document.getElementById('d-style')
  if (style) d.voucherStyle = style.value
  const invfmt = document.getElementById('d-invfmt')
  d.invoiceFormat = invfmt ? invfmt.value : ''
  const invno = document.getElementById('d-invno')
  if (invno) d.invoiceNo = invno.value
  const invdate = document.getElementById('d-invdate')
  if (invdate) d.invoiceDate = invdate.value
  const taxid = document.getElementById('d-taxid')
  if (taxid) d.vendorTaxId = taxid.value.replace(/\D/g, '').slice(0, 8)
  const tax = document.getElementById('d-tax')
  if (tax) d.taxable = tax.disabled ? '未稅' : tax.value
  document.querySelectorAll('.d-line-name').forEach((el) => { d.lines[el.dataset.i].name = el.value.slice(0, 50) })
  document.querySelectorAll('.d-line-tax').forEach((el) => { d.lines[el.dataset.i].taxable = el.value })
  document.querySelectorAll('.d-line-amt').forEach((el) => { d.lines[el.dataset.i].amount = sanitizeAmountInput(el.value, allowsDecimalAmount(rowCurrency(currentRow()))) })
}

function renderWriteoffTab(row){
  const source = (row.vouchers || []).filter((item) => isWriteoffPhase(item.status))
  const currency = rowCurrency(row)
  const remaining = parentUnwrittenRemaining(row.vouchers)
  const paidTotal = row.amount || remaining
  const canWriteback = state.role === '建檔人' && (row.status === '待核銷' || row.status === '部分核銷')
  const draft = state.writebackDraft || emptyWritebackDraft()
  const target = (row.vouchers || []).find((item) => item.id === state.writebackTargetId)
  const detailRemaining = target ? remainingWriteoffAmount(target) : remaining
  const detailWritten = target ? writtenOffAmount(target) : 0
  const errors = draft.errors || {}
  const isInvoice = state.writebackStyle === '發票'
  const needTaxId = needsWritebackInvoiceTaxId(row)
  const allowDecimal = allowsDecimalAmount(currency)
  const invoiceFields = isInvoice ? `
    <div class="modal-row"><span class="required">發票號碼（憑證號碼）</span><div class="modal-field"><input id="wb-invno" class="${errCls(errors,'invoiceNo')}" placeholder="請輸入發票號碼" value="${esc(draft.invoiceNo)}">${errText(errors,'invoiceNo')}</div></div>
    ${needTaxId ? `<div class="modal-row"><span class="required">發票統編</span><div class="modal-field"><select id="wb-invtax" class="${errCls(errors,'invoiceTaxId')}"><option value="">請選擇</option>${WRITEBACK_INVOICE_TAX_IDS.map((x)=>`<option ${x===draft.invoiceTaxId?'selected':''}>${x}</option>`).join('')}</select>${errText(errors,'invoiceTaxId')}</div></div>` : ''}
    <div class="modal-row"><span class="required">發票日期</span><div class="modal-field"><input id="wb-invdate" class="${errCls(errors,'invoiceDate')}" type="date" value="${esc(draft.invoiceDate)}">${errText(errors,'invoiceDate')}</div></div>
    <div class="modal-row"><span class="required">發票格式</span><div class="modal-field"><select id="wb-invfmt" class="${errCls(errors,'invoiceFormat')}"><option value="">請選擇</option>${INVOICE_FORMATS.map((x)=>`<option ${x===draft.invoiceFormat?'selected':''}>${x}</option>`).join('')}</select>${errText(errors,'invoiceFormat')}</div></div>
  ` : ''
  const fileField = `<div class="file-block" style="margin-left:0"><label class="required">上傳附件</label><input id="wb-file" type="file">${draft.file ? `<div class="file-names">${esc(draft.file.name)}</div>` : ''}${errText(errors,'file')}</div>`
  const backModal = state.writeoffModal === 'back' && target ? `
    <div class="modal-mask" id="writeoff-mask">
      <div class="modal-card">
        <div class="modal-head"><h2>回壓憑證文件</h2><button type="button" class="modal-close" id="writeoff-close">×</button></div>
        <div class="modal-row"><span class="required">選擇憑證樣式</span><div class="modal-field"><select id="wb-style"><option ${isInvoice?'selected':''}>發票</option><option ${!isInvoice?'selected':''}>其他</option></select></div></div>
        ${invoiceFields}
        <div class="modal-row"><span class="required">金額</span><div class="modal-field"><input id="wb-amount" class="${errCls(errors,'amount')}" inputmode="${allowDecimal ? 'decimal' : 'numeric'}" value="${esc(draft.amount)}" placeholder="不可超過 ${formatAmount(detailRemaining, currency)}">${errText(errors,'amount')}</div></div>
        ${fileField}
        <p class="writeback-summary">付款總金額：${formatAmount(paidTotal, currency)}　|　本明細已核銷：${formatAmount(detailWritten, currency)}　|　本明細未核銷餘額：${formatAmount(detailRemaining, currency)}</p>
        <div class="modal-foot">
          <button type="button" class="btn btn-default" id="writeoff-cancel">取消</button>
          <button type="button" class="btn btn-primary" id="writeoff-ok">確定</button>
        </div>
      </div>
    </div>` : ''
  const rec = state.viewingWriteback
  const viewModal = state.writeoffModal === 'view' && rec ? `
    <div class="modal-mask" id="writeoff-mask">
      <div class="modal-card">
        <div class="modal-head"><h2>回壓憑證檢視：${esc(row.no)}-${esc(rec.id)}</h2><button type="button" class="modal-close" id="writeoff-close">×</button></div>
        <div class="view-meta">
          <div><dt>核銷單號</dt><dd>${esc(row.no)}-${esc(rec.id)}</dd></div>
          <div><dt>憑證樣式</dt><dd>${esc(rec.style)}</dd></div>
          ${rec.style === '發票' ? `
          <div><dt>發票格式</dt><dd>${esc(rec.invoiceFormat || '-')}</dd></div>
          <div><dt>發票號碼（憑證號碼）</dt><dd>${esc(rec.invoiceNo || '-')}</dd></div>
          ${rec.invoiceTaxId ? `<div><dt>發票統編</dt><dd>${esc(rec.invoiceTaxId)}</dd></div>` : ''}
          <div><dt>發票日期</dt><dd>${esc((rec.invoiceDate || '').replace(/-/g,'/') || '-')}</dd></div>
          ` : ''}
          <div><dt>金額</dt><dd>${formatAmount(rec.amount, currency)}</dd></div>
          <div><dt>廠商統編</dt><dd>${esc(rec.vendorTaxId || '-')}</dd></div>
          <div><dt>上傳時間</dt><dd>${esc(rec.uploadedAt)}</dd></div>
        </div>
        <div>憑證檔案${rec.file ? '（' + esc(rec.file.name) + '）' : '：尚未上傳'}</div>
        <div class="view-files-body writeback-file-body">
          ${rec.file
            ? filePreviewHtml(rec.file, '回壓文件')
            : '<p class="placeholder-note">尚未上傳回壓文件</p>'}
        </div>
        <div class="modal-foot"><button type="button" class="btn btn-default" id="writeoff-cancel">關閉</button></div>
      </div>
    </div>` : ''
  const rowsHtml = source.length === 0
    ? `<tr><td colspan="4" class="writeoff-empty">尚無待核銷明細。請先新增憑證明細並完成付款。</td></tr>`
    : source.map((item, idx) => {
        const full = remainingWriteoffAmount(item) <= 0
        const disabled = !canWriteback || full
        const title = row.status === '已完成'
          ? '已完成申請不可再回壓'
          : (full ? '此明細已全額回壓，不可再回壓' : (!canWriteback ? '僅建檔人可回壓憑證' : ''))
        const childRows = writebacksOf(item).map((rec) => `
          <tr class="writeoff-child">
            <td colspan="3">${esc(formatWritebackLabel(rec, currency))}</td>
            <td class="writeoff-ops">
              <button type="button" data-wo="view" data-vid="${item.id}" data-wbid="${rec.id}">檢視憑證</button>
              ${canWriteback ? `<button type="button" class="danger" data-wo="void" data-vid="${item.id}" data-wbid="${rec.id}">作廢</button>` : ''}
            </td>
          </tr>
        `).join('')
        return `
          <tr>
            <td>${idx + 1}. ${esc(item.purpose)}</td>
            <td>${item.taxable}</td>
            <td class="num">${formatAmount(item.payAmount, currency)}</td>
            <td class="writeoff-ops">
              <button type="button" data-wo="back" data-vid="${item.id}" ${disabled ? 'disabled' : ''} title="${esc(title)}">回壓憑證文件</button>
            </td>
          </tr>
          ${childRows}
        `
      }).join('')
  return `
    <div class="writeoff-panel">
      <p class="writeoff-summary">母單：${row.no}（未核銷餘額：${formatAmount(remaining, currency)}）</p>
      <table class="writeoff-table">
        <thead><tr><th>明細</th><th>應稅 / 未稅</th><th>金額</th><th>操作</th></tr></thead>
        <tbody>${rowsHtml}</tbody>
      </table>
    </div>
    ${backModal}${viewModal}
  `
}

function renderWorkspace(){
  const row = currentRow()
  if (!row) {
    return `<div class="summary-card"><p class="placeholder-note">找不到這張付款申請。</p><button class="btn btn-default" id="btn-back">返回列表</button></div>`
  }
  const showWriteoff = showWriteoffTab(row)
  if (state.tab === 'writeoff' && !showWriteoff) state.tab = 'details'
  const writable = canEdit(state.role, row.status)
  const writeoffType = needsWriteoff(row.type)

  let hint = ''
  if (writeoffType && showWriteoff) {
    hint = '此單為「事後才拿到發票」。財務已完成付款，顯示 <strong>3 個頁籤</strong>。明細可逐列核銷，列狀態為待核銷／部分核銷／核銷完成；全部核銷完成後母單為已完成。'
  } else if (writeoffType) {
    hint = '此單為「事後才拿到發票」。完成付款前只顯示 <strong>2 個頁籤</strong>。'
  } else {
    hint = '此單為「申請前即可拿到發票」，只顯示 <strong>2 個頁籤</strong>。'
  }

  let body = ''
  if (state.tab === 'overview') {
    body = renderOverview()
  } else if (state.tab === 'details') {
    body = renderDetailsTab(row)
  } else {
    body = renderWriteoffTab(row)
  }

  return `
    <div class="page-header">
      <div><h1>付款申請單</h1><p class="field-hint">單號：${row.no}　狀態：${row.status}</p></div>
      <button class="btn btn-default" id="btn-back">返回列表</button>
    </div>
    <div class="mode-banner ${writable ? 'is-edit' : 'is-view'}">目前操作人：${state.role}　狀態：${row.status}　${writable ? '此狀態可由目前操作人編輯「付款總覽」「款項憑證明細」。' : '此狀態目前操作人不可編輯，付款總覽與款項憑證明細為唯讀。'}</div>
    <div class="logic-hint">${hint}</div>
    <div class="tabs">
      <button type="button" class="tab ${state.tab==='overview'?'active':''}" data-tab="overview">付款總覽</button>
      <button type="button" class="tab ${state.tab==='details'?'active':''}" data-tab="details">款項憑證明細</button>
      ${showWriteoff ? `<button type="button" class="tab ${state.tab==='writeoff'?'active':''}" data-tab="writeoff">核銷歷史</button>` : ''}
    </div>
    ${body}
  `
}

function bindDatePicker(){
  document.querySelectorAll('[data-date-open]').forEach((btn) => {
    btn.onclick = (e) => {
      e.preventDefault()
      e.stopPropagation()
      const key = btn.dataset.dateOpen
      if (state.datePicker && state.datePicker.key === key) {
        state.datePicker = null
        render()
        return
      }
      const from = state.filters[key + 'From'] || today()
      const view = parseMonth(from)
      state.datePicker = { key, viewY: view.y, viewM: view.m, hover: '' }
      render()
    }
  })
  document.querySelectorAll('[data-date-nav]').forEach((btn) => {
    btn.onclick = (e) => {
      e.preventDefault()
      e.stopPropagation()
      if (!state.datePicker) return
      const next = addMonths(state.datePicker.viewY, state.datePicker.viewM, Number(btn.dataset.dateNav))
      state.datePicker.viewY = next.y
      state.datePicker.viewM = next.m
      render()
    }
  })
  document.querySelectorAll('[data-date-pick]').forEach((btn) => {
    btn.onclick = (e) => {
      e.preventDefault()
      e.stopPropagation()
      if (!state.datePicker) return
      const key = state.datePicker.key
      const date = btn.dataset.datePick
      const from = state.filters[key + 'From']
      const to = state.filters[key + 'To']
      if (!from || to) {
        state.filters[key + 'From'] = date
        state.filters[key + 'To'] = ''
        state.datePicker.hover = ''
        render()
        return
      }
      state.filters[key + 'From'] = from <= date ? from : date
      state.filters[key + 'To'] = from <= date ? date : from
      state.datePicker = null
      render()
    }
  })
  const panel = document.querySelector('.date-range-panel')
  if (panel) {
    panel.style.left = '0'
    panel.style.right = 'auto'
    const rect = panel.getBoundingClientRect()
    if (rect.right > window.innerWidth - 8) {
      panel.style.left = 'auto'
      panel.style.right = '0'
    }
  }
}

function bindFilterPayee(){
  document.querySelectorAll('input[name="f-payee-kind"]').forEach((el) => {
    el.onchange = () => {
      state.filters.payeeKind = el.value
      state.filters.payeeId = ''
      state.filterPayeeOpen = false
      state.filterPayeeKeyword = ''
      render()
    }
  })
  const trigger = document.getElementById('f-payee-trigger')
  if (!trigger) return
  trigger.onclick = (e) => {
    e.preventDefault()
    state.filterPayeeOpen = !state.filterPayeeOpen
    if (!state.filterPayeeOpen) state.filterPayeeKeyword = ''
    render()
    const search = document.getElementById('f-payee-search')
    if (search) search.focus()
  }
  const search = document.getElementById('f-payee-search')
  if (search) {
    search.oninput = () => {
      const cursor = search.selectionStart
      state.filterPayeeKeyword = search.value
      render()
      const el = document.getElementById('f-payee-search')
      if (el) {
        el.focus()
        el.setSelectionRange(cursor, cursor)
      }
    }
  }
  document.querySelectorAll('[data-f-payee]').forEach((btn) => {
    btn.onclick = (e) => {
      e.preventDefault()
      e.stopPropagation()
      state.filters.payeeId = btn.dataset.fPayee || ''
      state.filterPayeeOpen = false
      state.filterPayeeKeyword = ''
      render()
    }
  })
}

function bindForm(){
  const typeEl = document.getElementById('o-type')
  const dateEl = document.getElementById('o-date')
  if (!typeEl || !dateEl) return
  const sync = () => {
    if (typeEl.disabled) return
    state.saved = false
    state.form.type = typeEl.value
    state.form.date = dateEl.value
    state.form.month = (document.getElementById('o-month') || {}).value || ''
    state.form.vendor = (document.getElementById('o-vendor') || {}).value || ''
    if (isPettyType(state.form.type)) {
      if (!EMPLOYEES.some((e) => e.id === state.form.vendor)) {
        const applicant = (currentRow() && currentRow().applicant) || 'ruby.lee'
        state.form.vendor = findEmployeeForApplicant(applicant).id
      }
    } else if (EMPLOYEES.some((e) => e.id === state.form.vendor) && !VENDORS.some((v) => v.id === state.form.vendor)) {
      state.form.vendor = ''
    }
    state.form.currency = document.getElementById('o-currency').value
    state.form.method = document.getElementById('o-method').value
    state.form.fee = document.getElementById('o-fee').value
    state.form.expected = expectedFor(state.form.type, state.form.date)
    state.payeeOpen = false
    state.payeeKeyword = ''
    render()
  }
  typeEl.onchange = sync
  dateEl.onchange = sync
  document.getElementById('overview-form').onsubmit = (e) => {
    e.preventDefault()
    if (typeEl.disabled) return
    state.submitted = true
    state.form.type = typeEl.value
    state.form.date = dateEl.value
    state.form.month = (document.getElementById('o-month') || {}).value || ''
    state.form.vendor = document.getElementById('o-vendor').value
    state.form.currency = document.getElementById('o-currency').value
    state.form.method = document.getElementById('o-method').value
    state.form.fee = document.getElementById('o-fee').value
    const expectedEl = document.getElementById('o-expected')
    if (expectedEl && !expectedEl.disabled) state.form.expected = expectedEl.value
    const meta = META[state.form.type]
    if ((meta.settlement && !state.form.month) || !state.form.vendor) { render(); return }
    if (state.page === 'workspace') {
      const row = currentRow()
      row.type = state.form.type
      row.expected = state.form.expected
      row.overview = { ...state.form, vendorName: payeeDisplayName(state.form.vendor, state.form.type) }
      state.saved = true
      state.submitted = false
      render()
      return
    }
    const id = 'DRAFT-' + Date.now()
    const created = {
      id,
      no: 'PA' + today().replaceAll('-', '') + String(ROWS.length + 1).padStart(3, '0'),
      type: state.form.type,
      applicant: 'ruby.lee',
      details: 0,
      amount: 0,
      created: today() + ' 12:00:00',
      expected: state.form.expected,
      actual: null,
      reason: null,
      status: '草稿',
      vouchers: [],
      overview: { ...state.form, id, vendorName: payeeDisplayName(state.form.vendor, state.form.type) },
      exchangeRate: null,
      exportedFile: null,
    }
    ROWS.unshift(created)
    state.currentId = id
    state.tab = 'details'
    state.saved = false
    setPage('workspace')
  }
}

function render(){
  document.querySelectorAll('.ellipsis-bubble').forEach((node) => node.remove())
  const app = document.getElementById('app')
  if (state.page === 'list') app.innerHTML = renderList()
  else if (state.page === 'overview') app.innerHTML = renderOverview()
  else app.innerHTML = renderWorkspace()

  if (state.page === 'list') {
    document.getElementById('btn-new').onclick = () => {
      state.submitted = false
      state.form = { type:'個人代墊報支', month:'', date: today(), vendor: findEmployeeForApplicant('ruby.lee').id, currency:'臺幣TWD', method:'匯款', fee:'公司負擔', expected: expectedFor('個人代墊報支', today()) }
      setPage('overview')
    }
    const noInput = document.getElementById('f-no')
    noInput.oninput = () => {
      const cursor = noInput.selectionStart
      state.filters.no = noInput.value
      render()
      const el = document.getElementById('f-no')
      el.focus()
      el.setSelectionRange(cursor, cursor)
    }
    document.getElementById('btn-search').onclick = () => {
      const f = state.filters
      state.filters = {
        no: document.getElementById('f-no').value,
        type: document.getElementById('f-type').value,
        status: document.getElementById('f-status').value,
        applicant: document.getElementById('f-applicant').value,
        payeeKind: f.payeeKind || '',
        payeeId: f.payeeId || '',
        createdFrom: f.createdFrom || '',
        createdTo: f.createdTo || '',
        expectedFrom: f.expectedFrom || '',
        expectedTo: f.expectedTo || '',
        actualFrom: f.actualFrom || '',
        actualTo: f.actualTo || '',
      }
      render()
    }
    document.getElementById('btn-reset').onclick = () => {
      state.filters = { no:'', type:'', status:'', applicant:'', payeeKind:'', payeeId:'', createdFrom:'', createdTo:'', expectedFrom:'', expectedTo:'', actualFrom:'', actualTo:'' }
      state.filterPayeeOpen = false
      state.filterPayeeKeyword = ''
      state.datePicker = null
      state.notice = ''
      render()
    }
    bindFilterPayee()
    bindDatePicker()
    bindReasonBubbles()
    app.querySelectorAll('[data-act]').forEach(btn => {
      btn.onclick = () => {
        if (btn.disabled) return
        const row = ROWS.find(r => r.id === btn.dataset.id)
        const act = btn.dataset.act
        if (act === 'edit') {
          state.currentId = row.id
          state.tab = 'overview'
          state.form = formFromRow(row)
          state.saved = false
          state.submitted = false
          setPage('workspace')
          return
        }
        if (act === 'view' || act === 'review') {
          state.currentId = row.id
          state.tab = 'details'
          state.form = formFromRow(row)
          state.saved = false
          state.submitted = false
          setPage('workspace')
          return
        }
        if (act === 'void') {
          if (confirm('確定作廢 ' + row.no + '？')) {
            row.status = '已作廢'
            state.notice = row.no + ' 已作廢'
          }
          render()
          return
        }
        if (act === 'writeoff') {
          state.currentId = row.id
          state.tab = 'writeoff'
          state.form = formFromRow(row)
          setPage('workspace')
          return
        }
        if (act === 'auditFile') {
          state.auditOpen = true
          state.auditTargetId = row.id
          render()
          return
        }
        if (act === 'pay') {
          state.payOpen = true
          state.payTargetId = row.id
          state.payRate = ''
          state.payDate = today()
          state.payDateError = ''
          state.payError = ''
          render()
          return
        }
        const map = { }
        state.notice = row.no + '：' + (map[act] || act)
        render()
      }
    })
    bindPayRateModal()
    bindAuditFileModal()
  }
  if (state.page === 'overview') {
    bindForm()
    bindPayeeSelect()
  }
  if (state.page === 'workspace') {
    const back = document.getElementById('btn-back')
    if (back) back.onclick = () => setPage('list')
    app.querySelectorAll('[data-tab]').forEach((btn) => {
      btn.onclick = () => {
        state.tab = btn.dataset.tab
        render()
      }
    })
    bindForm()
    bindPayeeSelect()
    bindVoucherUi()
  }
}

function bindAuditFileModal(){
  const closeAudit = () => {
    state.auditOpen = false
    state.auditTargetId = ''
    render()
  }
  const mask = document.getElementById('audit-file-mask')
  if (mask) mask.onclick = (e) => { if (e.target === mask) closeAudit() }
  const closeBtn = document.getElementById('audit-file-close')
  const cancelBtn = document.getElementById('audit-file-cancel')
  if (closeBtn) closeBtn.onclick = closeAudit
  if (cancelBtn) cancelBtn.onclick = closeAudit
  const dl = document.getElementById('audit-file-download')
  if (dl && !dl.disabled) dl.onclick = () => {
    const row = ROWS.find((r) => r.id === state.auditTargetId)
    const file = row && row.exportedFile
    if (!file) return
    const link = document.createElement('a')
    link.href = file.url
    link.download = file.name
    link.click()
  }
}

function bindPayRateModal(){
  const closePay = () => {
    state.payOpen = false
    state.payTargetId = ''
    state.payRate = ''
    state.payDate = ''
    state.payDateError = ''
    state.payError = ''
    render()
  }
  const mask = document.getElementById('pay-rate-mask')
  if (mask) mask.onclick = (e) => { if (e.target === mask) closePay() }
  const closeBtn = document.getElementById('pay-rate-close')
  const cancelBtn = document.getElementById('pay-rate-cancel')
  if (closeBtn) closeBtn.onclick = closePay
  if (cancelBtn) cancelBtn.onclick = closePay
  const dateEl = document.getElementById('pay-date')
  if (dateEl) {
    dateEl.oninput = () => {
      state.payDate = dateEl.value
      if (state.payDateError) state.payDateError = ''
    }
    dateEl.focus()
  }
  const rateEl = document.getElementById('pay-rate')
  if (rateEl) {
    rateEl.oninput = () => {
      const next = sanitizeRateInput(rateEl.value)
      if (rateEl.value !== next) rateEl.value = next
      state.payRate = rateEl.value
      if (state.payError) state.payError = ''
    }
    rateEl.onkeydown = (e) => {
      if (e.key === 'Enter') document.getElementById('pay-rate-ok').click()
    }
  }
  const ok = document.getElementById('pay-rate-ok')
  if (ok) ok.onclick = () => {
    const row = ROWS.find((r) => r.id === state.payTargetId)
    if (!row) return
    const actualPaymentDate = (document.getElementById('pay-date')?.value || '').trim()
    state.payDate = actualPaymentDate
    let okPay = true
    if (!actualPaymentDate) {
      state.payDateError = '請選擇實際付款日'
      okPay = false
    } else {
      state.payDateError = ''
    }
    let exchangeRate
    const needRate = isForeignCurrency(rowCurrency(row))
    if (needRate) {
      const next = (document.getElementById('pay-rate')?.value || '').trim()
      state.payRate = next
      if (!next) {
        state.payError = '請填入付款匯率'
        okPay = false
      } else {
        const parsed = Number(next)
        if (!Number.isFinite(parsed) || parsed <= 0) {
          state.payError = '請輸入大於 0 的匯率'
          okPay = false
        } else {
          state.payError = ''
          exchangeRate = parsed
        }
      }
    }
    if (!okPay) {
      render()
      return
    }
    completePay(row, { actualPaymentDate, exchangeRate })
    render()
  }
}

function bindVoucherUi(){
  const row = currentRow()
  if (!row) return
  const addBtn = document.getElementById('btn-add-detail')
  if (addBtn && !addBtn.disabled) addBtn.onclick = () => {
    state.modalMode = 'add'
    state.draft = emptyDraft(row)
    render()
  }
  const exp = document.getElementById('btn-export')
  if (exp && !exp.disabled) exp.onclick = async () => {
    const hasDraft = row.vouchers.some((item) => item.status === '草稿')
    // 無草稿但已有導出檔：重複下載同一份
    if (!hasDraft && row.exportedFile) {
      const link = document.createElement('a')
      link.href = row.exportedFile.url
      link.download = row.exportedFile.name
      link.click()
      return
    }
    if (!hasDraft) return
    exp.disabled = true
    const oldText = exp.textContent
    exp.textContent = '導出中…'
    try {
      await downloadVoucherPdf(row)
      row.vouchers.forEach((item) => { if (item.status === '草稿') item.status = '待審核' })
      if (row.status === '審核不通過') row.reason = ''
      if (row.status === '草稿' || row.status === '審核不通過') row.status = '待審核'
    } catch (err) {
      alert('導出 PDF 失敗，請再試一次。')
    }
    exp.textContent = oldText
    render()
  }
  const ap = document.getElementById('btn-approve')
  if (ap && !ap.disabled) ap.onclick = () => {
    row.status = '待付款'
    row.reason = ''
    row.vouchers.forEach((item) => { if (item.status === '待審核') item.status = '審核通過' })
    render()
  }
  const closeReject = () => {
    state.rejectOpen = false
    state.rejectReason = ''
    state.rejectError = ''
    render()
  }
  const rj = document.getElementById('btn-reject')
  if (rj && !rj.disabled) rj.onclick = () => {
    state.rejectOpen = true
    state.rejectReason = ''
    state.rejectError = ''
    render()
  }
  const rejectMask = document.getElementById('reject-mask')
  if (rejectMask) rejectMask.onclick = (e) => { if (e.target === rejectMask) closeReject() }
  const rejectClose = document.getElementById('reject-close')
  const rejectCancel = document.getElementById('reject-cancel')
  if (rejectClose) rejectClose.onclick = closeReject
  if (rejectCancel) rejectCancel.onclick = closeReject
  const rejectOk = document.getElementById('btn-reject-ok')
  if (rejectOk) rejectOk.onclick = () => {
    const reason = (document.getElementById('reject-reason').value || '').trim()
    if (!reason) {
      state.rejectReason = document.getElementById('reject-reason').value || ''
      state.rejectError = '請輸入不通過原因'
      render()
      return
    }
    row.status = '審核不通過'
    row.reason = reason
    row.vouchers.forEach((item) => {
      if (item.status === '待審核' || item.status === '審核通過') item.status = '草稿'
    })
    closeReject()
  }
  document.querySelectorAll('[data-vop]').forEach((btn) => {
    btn.onclick = () => {
      const item = row.vouchers.find((v) => v.id === btn.dataset.vid)
      if (!item) return
      if (btn.dataset.vop === 'view') { state.modalMode = 'view'; state.viewing = item; render() }
      if (btn.dataset.vop === 'edit') { state.modalMode = 'edit'; state.editingId = item.id; state.draft = emptyDraft(row, item); render() }
      if (btn.dataset.vop === 'void' && confirm('確定作廢此筆明細？')) {
        row.vouchers = row.vouchers.filter((v) => v.id !== item.id)
        refreshRowTotals(row)
        render()
      }
    }
  })
  const mask = document.getElementById('detail-mask')
  if (mask) mask.onclick = (e) => { if (e.target === mask) closeDetailModal() }
  const closeBtn = document.getElementById('modal-close')
  const cancelBtn = document.getElementById('modal-cancel')
  if (closeBtn) closeBtn.onclick = closeDetailModal
  if (cancelBtn) cancelBtn.onclick = closeDetailModal
  const purpose = document.getElementById('d-purpose')
  if (purpose) purpose.onchange = () => {
    syncDraftFromDom()
    const meta = PURPOSE_SECOND[state.draft.purpose]
    const auto = autoFill(row)
    state.draft.secondFrom = ''
    state.draft.secondTo = ''
    state.draft.secondText = (meta.kind === 'month' && auto && (state.draft.purpose === auto.purpose || state.draft.purpose === '通路費用(通路後扣)' || state.draft.purpose === 'URMART月結廠商')) ? auto.month : ''
    render()
  }
  const style = document.getElementById('d-style')
  if (style) style.onchange = () => { syncDraftFromDom(); if (state.draft.voucherStyle !== '發票') { state.draft.invoiceFormat = ''; state.draft.invoiceDate = '' } render() }
  const tax = document.getElementById('d-tax')
  if (tax) tax.onchange = () => {
    syncDraftFromDom()
    if (state.draft.taxable === '未稅') state.draft.lines.forEach((l) => { l.taxable = '未稅' })
    render()
  }
  const taxid = document.getElementById('d-taxid')
  if (taxid) taxid.oninput = () => { taxid.value = taxid.value.replace(/\D/g, '').slice(0, 8) }
  document.querySelectorAll('.d-line-amt').forEach((el) => {
    el.oninput = () => {
      const cleaned = sanitizeAmountInput(el.value, allowsDecimalAmount(rowCurrency(row)))
      if (el.value !== cleaned) el.value = cleaned
    }
    el.onchange = () => { syncDraftFromDom(); render() }
  })
  document.querySelectorAll('.d-line-tax').forEach((el) => {
    el.onchange = () => { syncDraftFromDom(); render() }
  })
  const addLine = document.getElementById('btn-add-line')
  if (addLine) addLine.onclick = (e) => {
    e.stopPropagation()
    syncDraftFromDom()
    state.draft.lines.push({ id: 'L-' + Date.now(), name: '', taxable: state.draft.taxable === '未稅' ? '未稅' : '應稅', amount: '' })
    render()
  }
  document.querySelectorAll('[data-del]').forEach((btn) => {
    btn.onclick = (e) => {
      e.stopPropagation()
      syncDraftFromDom()
      state.draft.lines.splice(Number(btn.dataset.del), 1)
      render()
    }
  })
  const file = document.getElementById('d-file')
  if (file) file.onchange = () => {
    syncDraftFromDom()
    state.draft.voucherFile = file.files[0] ? fileMeta(file.files[0]) : null
    render()
  }
  const atts = document.getElementById('d-atts')
  if (atts) atts.onchange = () => {
    syncDraftFromDom()
    Array.from(atts.files || []).forEach((f) => state.draft.attachments.push(fileMeta(f)))
    render()
  }
  const ok = document.getElementById('modal-ok')
  if (ok) ok.onclick = () => {
    syncDraftFromDom()
    const d = state.draft
    const second = PURPOSE_SECOND[d.purpose]
    const errors = {}
    if (second.kind === 'dateRange' && (!d.secondFrom || !d.secondTo)) errors.second = '請設定' + second.label
    else if (second.kind === 'dateRange' && d.secondFrom > d.secondTo) errors.second = second.label + '的結束日不可早於開始日'
    else if (second.kind !== 'dateRange' && !(d.secondText || '').trim()) errors.second = '請輸入' + second.label
    if (d.voucherStyle === '發票' && !d.invoiceFormat) errors.invoiceFormat = '請選擇發票格式'
    if (!(d.invoiceNo || '').trim()) errors.invoiceNo = '請輸入發票號碼(憑證號碼)'
    if (d.voucherStyle === '發票' && !d.invoiceDate) errors.invoiceDate = '請選擇發票日期'
    if (!/^\d{8}$/.test(d.vendorTaxId)) errors.vendorTaxId = '請輸入 8 位數字統編'
    d.lines.forEach((l, i) => {
      if (!(l.name || '').trim()) errors['lineName-' + i] = '請輸入明細細項'
      const amountErr = amountInputError(String(l.amount || ''), allowsDecimalAmount(rowCurrency(row)))
      if (amountErr) errors['lineAmount-' + i] = amountErr
    })
    if (!d.voucherFile) errors.voucherFile = '請上傳憑證檔案'
    d.errors = errors
    d.error = ''
    if (Object.keys(errors).length) { render(); return }
    if (isForeignCurrency(rowCurrency(row))) d.taxable = '未稅'
    const allowDecimal = allowsDecimalAmount(rowCurrency(row))
    const lines = d.lines.map((l) => ({ id: l.id, name: l.name.slice(0, 50), taxable: d.taxable === '未稅' ? '未稅' : l.taxable, amount: commitAmount(l.amount, allowDecimal) }))
    const tot = voucherTotals(d.taxable, lines, allowDecimal)
    const saved = {
      id: d.id,
      vendorTaxId: d.vendorTaxId,
      purpose: d.purpose,
      remarkNo: remarkNo(d.purpose, d.secondText, d.secondFrom, d.secondTo),
      secondText: d.secondText,
      secondFrom: d.secondFrom,
      secondTo: d.secondTo,
      voucherStyle: d.voucherStyle,
      invoiceFormat: d.voucherStyle === '發票' ? d.invoiceFormat : '',
      invoiceNo: d.invoiceNo,
      invoiceDate: d.voucherStyle === '發票' ? (d.invoiceDate || '') : '',
      taxable: d.taxable,
      untaxedAmount: tot.untaxedAmount,
      taxAmount: tot.taxAmount,
      payAmount: tot.payAmount,
      status: d.status || '草稿',
      lines,
      voucherFile: d.voucherFile,
      attachments: d.attachments,
      writebacks: d.writebacks || [],
    }
    const idx = row.vouchers.findIndex((v) => v.id === saved.id)
    if (idx >= 0) row.vouchers[idx] = saved
    else row.vouchers.push(saved)
    refreshRowTotals(row)
    closeDetailModal()
  }
  document.querySelectorAll('[data-wo]').forEach((btn) => {
    btn.onclick = () => {
      if (btn.disabled) return
      const item = row.vouchers.find((v) => v.id === btn.dataset.vid)
      if (btn.dataset.wo === 'back') {
        if (!item || remainingWriteoffAmount(item) <= 0 || state.role !== '建檔人') return
        if (!(row.status === '待核銷' || row.status === '部分核銷')) return
        state.writeoffModal = 'back'
        state.writebackTargetId = item.id
        state.writebackStyle = '發票'
        state.writebackDraft = emptyWritebackDraft()
        render()
        return
      }
      if (btn.dataset.wo === 'view') {
        const rec = item ? writebacksOf(item).find((w) => w.id === btn.dataset.wbid) : null
        if (!rec) return
        state.writeoffModal = 'view'
        state.viewingWriteback = { ...rec, vendorTaxId: item.vendorTaxId }
        render()
        return
      }
      if (btn.dataset.wo === 'void') {
        if (!(row.status === '待核銷' || row.status === '部分核銷') || state.role !== '建檔人') return
        if (!confirm('確定作廢此筆核銷紀錄？作廢後將刪除該筆回壓資料與核銷金額。')) return
        if (!item) return
        const rec = writebacksOf(item).find((w) => w.id === btn.dataset.wbid)
        if (!rec) return
        if (rec.file && rec.file.url && String(rec.file.url).indexOf('blob:') === 0) {
          URL.revokeObjectURL(rec.file.url)
        }
        item.writebacks = writebacksOf(item).filter((w) => w.id !== rec.id)
        item.status = nextDetailWriteoffStatus(item)
        const parentStatus = nextParentWriteoffStatus(row.vouchers)
        if (parentStatus) row.status = parentStatus
        render()
      }
    }
  })
  const closeWriteoff = () => {
    state.writeoffModal = ''
    state.writebackTargetId = ''
    state.viewingWriteback = null
    state.writebackDraft = emptyWritebackDraft()
    render()
  }
  const syncWritebackDraft = () => {
    const draft = state.writebackDraft || emptyWritebackDraft()
    const invno = document.getElementById('wb-invno')
    const invtax = document.getElementById('wb-invtax')
    const invdate = document.getElementById('wb-invdate')
    const invfmt = document.getElementById('wb-invfmt')
    const amount = document.getElementById('wb-amount')
    if (invno) draft.invoiceNo = invno.value
    if (invtax) draft.invoiceTaxId = invtax.value
    if (invdate) draft.invoiceDate = invdate.value
    if (invfmt) draft.invoiceFormat = invfmt.value
    if (amount) draft.amount = sanitizeAmountInput(amount.value, allowsDecimalAmount(rowCurrency(row)))
    state.writebackDraft = draft
  }
  const woMask = document.getElementById('writeoff-mask')
  if (woMask) woMask.onclick = (e) => { if (e.target === woMask) closeWriteoff() }
  const woClose = document.getElementById('writeoff-close')
  const woCancel = document.getElementById('writeoff-cancel')
  const woOk = document.getElementById('writeoff-ok')
  if (woClose) woClose.onclick = closeWriteoff
  if (woCancel) woCancel.onclick = closeWriteoff
  if (woOk) woOk.onclick = () => {
    syncWritebackDraft()
    const item = row.vouchers.find((v) => v.id === state.writebackTargetId)
    if (!item) { closeWriteoff(); return }
    if (row.status === '已作廢') { closeWriteoff(); return }
    const draft = state.writebackDraft
    const remaining = remainingWriteoffAmount(item)
    const allowDecimal = allowsDecimalAmount(rowCurrency(row))
    const errors = {}
    if (state.writebackStyle === '發票') {
      if (!(draft.invoiceNo || '').trim()) errors.invoiceNo = '請輸入發票號碼（憑證號碼）'
      if (needsWritebackInvoiceTaxId(row) && !draft.invoiceTaxId) errors.invoiceTaxId = '請選擇發票統編'
      if (!draft.invoiceDate) errors.invoiceDate = '請選擇發票日期'
      if (!draft.invoiceFormat) errors.invoiceFormat = '請選擇發票格式'
    }
    const amountErr = amountInputError(String(draft.amount || ''), allowDecimal)
    if (amountErr) errors.amount = amountErr
    else if (commitAmount(draft.amount, allowDecimal) > remaining) errors.amount = '回壓金額不可超過本明細未核銷餘額（' + formatAmount(remaining, rowCurrency(row)) + '）'
    if (!draft.file) errors.file = '請上傳附件'
    draft.errors = errors
    draft.error = ''
    if (Object.keys(errors).length) { render(); return }
    const n = commitAmount(draft.amount, allowDecimal)
    if (!item.writebacks) item.writebacks = []
    item.writebacks.push({
      id: 'WB-' + Date.now(),
      style: state.writebackStyle,
      invoiceNo: state.writebackStyle === '發票' ? draft.invoiceNo.trim() : '',
      invoiceTaxId: state.writebackStyle === '發票' && needsWritebackInvoiceTaxId(row) ? (draft.invoiceTaxId || '') : '',
      invoiceDate: state.writebackStyle === '發票' ? draft.invoiceDate : '',
      invoiceFormat: state.writebackStyle === '發票' ? draft.invoiceFormat : '',
      amount: n,
      uploadedAt: formatWritebackStamp(),
      file: draft.file,
    })
    item.status = nextDetailWriteoffStatus(item)
    const parent = nextParentWriteoffStatus(row.vouchers)
    if (parent) row.status = parent
    closeWriteoff()
  }
  const wbStyle = document.getElementById('wb-style')
  if (wbStyle) wbStyle.onchange = () => {
    syncWritebackDraft()
    state.writebackStyle = wbStyle.value
    render()
  }
  const wbFile = document.getElementById('wb-file')
  if (wbFile) wbFile.onchange = () => {
    syncWritebackDraft()
    state.writebackDraft.file = wbFile.files[0] ? fileMeta(wbFile.files[0]) : null
    render()
  }
  const wbAmount = document.getElementById('wb-amount')
  if (wbAmount) wbAmount.oninput = () => {
    const cleaned = sanitizeAmountInput(wbAmount.value, allowsDecimalAmount(rowCurrency(row)))
    if (wbAmount.value !== cleaned) wbAmount.value = cleaned
  }
}

document.getElementById('nav-list').onclick = () => setPage('list')
document.addEventListener('mousedown', (e) => {
  let changed = false
  if (state.payeeOpen) {
    const wrap = document.getElementById('payee-wrap')
    if (!(wrap && wrap.contains(e.target))) {
      state.payeeOpen = false
      state.payeeKeyword = ''
      changed = true
    }
  }
  if (state.filterPayeeOpen) {
    const wrap = document.getElementById('f-payee-wrap')
    if (!(wrap && wrap.contains(e.target))) {
      state.filterPayeeOpen = false
      state.filterPayeeKeyword = ''
      changed = true
    }
  }
  if (state.datePicker) {
    const wrap = document.getElementById('date-picker-' + state.datePicker.key)
    if (!(wrap && wrap.contains(e.target))) {
      state.datePicker = null
      changed = true
    }
  }
  if (changed) render()
})
document.querySelectorAll('.role-tab').forEach(btn => {
  btn.onclick = () => {
    state.role = btn.dataset.role
    document.querySelectorAll('.role-tab').forEach(b => b.classList.toggle('active', b === btn))
    render()
  }
})
render()
</script>
</body>
</html>
